name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - 'scripts/**'
      - 'site/**'
      - 'content/**'
      - '.github/workflows/pages.yml'
  # Commits pushed by refresh.yml use GITHUB_TOKEN and do not trigger `push`
  # workflows, so also deploy after every completed refresh run.
  workflow_run:
    workflows: ["Bot Data Auto-Refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: (vars.ENABLE_GITHUB_PAGES == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build configured production site (offline)
        run: python scripts/build_site.py --production

      - name: Render README for consistency check
        run: python scripts/render_readme.py

      - name: Validate data and README
        run: python scripts/validate.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
